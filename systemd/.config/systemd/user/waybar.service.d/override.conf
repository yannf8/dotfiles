# Drop-in over the packaged /usr/lib/systemd/user/waybar.service.
#
# Why this exists: waybar's battery module walks /sys/class/power_supply on a
# timer, and upstream rethrows any std::filesystem error out of a worker thread
# that has no handler -- so the whole bar aborts (SIGABRT) if a power_supply
# device disappears mid-scan. A DualSense re-enumerating over USB does exactly
# that. Upstream: refreshBatteries() in src/modules/battery.cpp.
#
# We cannot prevent the throw from config (the directory is iterated before the
# "bat" name filter is applied), so supervise the bar instead and let it come
# straight back.

[Unit]
# A flaky USB cable can produce several crashes in quick succession; the default
# start limit (5 in 10s) would give up and leave the session with no bar.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=1
