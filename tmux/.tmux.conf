# ~/.tmux.conf: vim-flavoured tmux (tmux 3.7c)
#
# Prefix is still Ctrl-b. "prefix x" means: press Ctrl-b, let go, press x.
# Reload after editing:  prefix r
# Every binding:         prefix ?     What one key does: prefix /
# Full explanation:      ~/claude-projects/tmux/TMUX-GUIDE.md

# ============================================================
#  Basics
# ============================================================
set  -g mouse on                # mouse still works if you want it (Shift+drag = terminal selection)
set  -g history-limit 50000     # scrollback per pane (default is 2000)
set  -g base-index 1            # windows numbered from 1, so prefix 1 is the leftmost key
setw -g pane-base-index 1       # panes numbered from 1 too
set  -g renumber-windows on     # close window 2 of 3 and window 3 becomes 2
set  -sg escape-time 10         # Esc reaches vim/nvim instantly
set  -g focus-events on         # nvim knows when its pane gains/loses focus
set  -g display-panes-time 2000 # prefix q shows pane numbers for 2 s
set  -g default-terminal "tmux-256color"
set  -as terminal-features ",*:RGB"   # true colour for nvim themes

# ============================================================
#  Vi keys everywhere
# ============================================================
setw -g mode-keys vi            # copy mode and the choose/tree lists use vim keys
set  -g status-keys vi          # the prefix : command prompt uses vim keys (Esc = normal mode)

# ============================================================
#  Panes: move like Ctrl-w h/j/k/l in vim
# ============================================================
bind h select-pane -L           # prefix h  pane left
bind j select-pane -D           # prefix j  pane down
bind k select-pane -U           # prefix k  pane up
bind l select-pane -R           # prefix l  pane right

# No prefix at all: hold Alt and tap h/j/k/l. The fastest way to hop
# between the Claude pane and a reader pane.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize with Shift + h/j/k/l. -r = repeatable: prefix H H H keeps growing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
#  Splits: like :vsplit and :split, opening in the current directory
# ============================================================
bind v split-window -h -c "#{pane_current_path}"   # prefix v  side by side  (vim :vsplit)
bind s split-window -v -c "#{pane_current_path}"   # prefix s  stacked       (vim :split)
bind % split-window -h -c "#{pane_current_path}"   # the default keys still work,
bind '"' split-window -v -c "#{pane_current_path}" # just in the current directory now

# ============================================================
#  Windows (tabs)
# ============================================================
bind c new-window -c "#{pane_current_path}"   # prefix c  new window here
bind -r C-h previous-window                   # prefix Ctrl-h  previous window (repeatable)
bind -r C-l next-window                       # prefix Ctrl-l  next window (repeatable)
bind Tab last-window                          # prefix Tab  flip to last window (default l is now "pane right")

# ============================================================
#  Sessions
# ============================================================
bind S choose-tree -Zs          # prefix S  session tree (default s is now "split")

# ============================================================
#  Copy mode: scroll and yank with vim keys
# ============================================================
# ------------------------------------------------------------
#  Three modes, shown bottom right:
#    PROMPT  typing in Claude's prompt box (SHELL in a normal pane)
#    SCROLL  Claude's transcript view: j/k, Ctrl-u/d, g/G through the whole chat
#    COPY    tmux copy mode: vim cursor + /search over what's on screen
#
#  tmux can't see inside Claude, so it tracks SCROLL itself with a per-pane
#  flag (@scroll): set when Ctrl-o opens the transcript, cleared when
#  q / Esc / Ctrl-c / Ctrl-o closes it. The keys still reach Claude as normal.
# ------------------------------------------------------------
bind [ copy-mode                # prefix [    COPY mode in any pane

# prefix Esc: SCROLL in a Claude pane, COPY anywhere else
bind Escape if -F "#{==:#{pane_current_command},claude}" \
  { send-keys C-o ; if -F "#{@scroll}" { set -pu @scroll } { set -p @scroll 1 } ; refresh-client -S } \
  { copy-mode }

# Ctrl-o pressed directly in Claude toggles SCROLL too
bind -n C-o if -F "#{==:#{pane_current_command},claude}" \
  { send-keys C-o ; if -F "#{@scroll}" { set -pu @scroll } { set -p @scroll 1 } ; refresh-client -S } \
  { send-keys C-o }

# Keys that close Claude's transcript: pass them through, then drop back to PROMPT.
# When @scroll isn't set these just type the key as usual.
bind -n q      if -F "#{@scroll}" { send-keys q      ; set -pu @scroll ; refresh-client -S } { send-keys q }
bind -n Escape if -F "#{@scroll}" { send-keys Escape ; set -pu @scroll ; refresh-client -S } { send-keys Escape }
bind -n C-c    if -F "#{@scroll}" { send-keys C-c    ; set -pu @scroll ; refresh-client -S } { send-keys C-c }
bind P paste-buffer -p          # prefix P  paste (prefix ] still works)

set -s copy-command 'wl-copy'   # every yank also lands in the Wayland clipboard

bind -T copy-mode-vi v      send -X begin-selection        # v  start selecting (like visual mode)
bind -T copy-mode-vi C-v    send -X rectangle-toggle       # Ctrl-v  block selection
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel   # y  yank and leave copy mode
bind -T copy-mode-vi i      send -X cancel                 # i  back to typing, like leaving normal mode
# Esc: clear the selection if there is one, otherwise leave copy mode
bind -T copy-mode-vi Escape if -F "#{selection_present}" { send -X clear-selection } { send -X cancel }

# ============================================================
#  Reading docs in vim on top of Claude
#  prefix e: fuzzy-pick a .md under ~/claude-projects and open it read-only
#  in nvim in a floating popup. :q closes the popup and you're back at the prompt.
# ============================================================
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  'f=$(fd -t f -e md . ~/claude-projects | fzf --prompt="read> ") && nvim -R "$f"'

# ============================================================
#  Vibe mode (just for fun)
#  prefix V: name a session (blank = random silly name). It opens in ~/vibes/<name>,
#  starts claude, and the PROMPT badge becomes a rainbow VIBE with rotating taglines.
#  Script: ~/.config/tmux/vibe.sh
# ============================================================
bind V command-prompt -p "🌈 vibe session name (blank = surprise me):" \
  { set -g @vibe_name "%%" ; run-shell "~/.config/tmux/vibe.sh new '#{client_name}'" }

# ============================================================
#  Reload
# ============================================================
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ============================================================
#  Status bar (gruvbox-ish, to match nvim)
#  Bottom right: PREFIX (yellow) after Ctrl-b, then the mode of the active pane:
#  COPY (purple), SCROLL (blue), PROMPT (green, Claude pane) or SHELL (grey).
# ============================================================
set  -g status-position bottom
set  -g status-style "bg=#3c3836,fg=#ebdbb2"
set  -g status-left  "#[bg=#458588,fg=#282828,bold] #S #[default] "
set  -g status-left-length 30
set  -g status-right-length 60
set  -g status-right "#{?client_prefix,#[bg=#d79921 fg=#282828 bold] PREFIX #[default] ,}\
#{?#{==:#{pane_mode},copy-mode},#[bg=#b16286 fg=#282828 bold] COPY ,\
#{?#{@scroll},#[bg=#458588 fg=#282828 bold] SCROLL ,\
#{?#{==:#{pane_current_command},claude},#{?#{@vibe},#(~/.config/tmux/vibe.sh badge),#[bg=#98971a fg=#282828 bold] PROMPT },#[bg=#665c54 fg=#ebdbb2 bold] SHELL }}}\
#[default] %a %H:%M "
setw -g window-status-format         " #I:#W#F "
setw -g window-status-current-format "#[bg=#98971a,fg=#282828,bold] #I:#W#F "
set  -g pane-border-style        "fg=#504945"
set  -g pane-active-border-style "fg=#98971a"
set  -g message-style            "bg=#d79921,fg=#282828"
setw -g mode-style               "bg=#d79921,fg=#282828"
